[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aneupy"
version = "1.1.0"
description = "Parametric, simulation-ready geometries of abdominal aortic aneurysms with SALOME"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
authors = [
    {name = "Mario de Lucio", email = "mdeluci@purdue.edu"},
    {name = "Jacobo Díaz"},
    {name = "Alberto de Castro"},
    {name = "Luis E. Romera"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/mdeluci/AneuPy"

[tool.setuptools]
packages = ["aneupy"]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "D", "B", "UP", "I"]
ignore = ["UP030", "UP031", "UP032", "B904", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D", "N"]
"examples/*" = ["D100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 100
